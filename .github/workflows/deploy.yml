name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-secret-key-not-used-in-production-000000"
      DATABASE_URL: "postgres://test:test@localhost:5432/test"
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar libs de sistema (weasyprint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi-dev

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Checar migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: python manage.py test

      - name: Collectstatic
        run: python manage.py collectstatic --noinput

      - name: Checks de deploy
        run: python manage.py check --deploy

  deploy:
    needs: test
    # Só faz deploy em push na main E quando a variável ENABLE_DEPLOY=true
    # estiver definida (Settings > Variables). Assim o pipeline não fica
    # vermelho antes da VPS/secrets estarem prontos.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: DEPLOY_SHA=${{ github.sha }} bash ~/capivara-tech/docker/deploy.sh
