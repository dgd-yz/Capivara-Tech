{% load static %}
{% load qr_code %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificado - {{ participant_name }}</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        border: 0;
      }
      
      @page {
        size: A4 landscape;
        margin: 0;
        {% if background_url %}background: url('{{ background_url }}') center / 297mm 210mm no-repeat;{% endif %}
      }
      
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      
      .text-tiny { font-size: 0.7em; }
      .text-small { font-size: 0.85em; }
      .text-big { font-size: 1.4em; }
      .text-huge { font-size: 1.8em; }
      .certificate-text {
        margin: {{ layout.margin_top }}mm {{ layout.margin_right }}mm {{ layout.margin_bottom }}mm {{ layout.margin_left }}mm;
        font-size: 16pt;
        line-height: 1.5;
      }
      .certificate-text p { margin: 0 0 4mm; }
      .certificate-text img { max-width: 100%; height: auto; }
      .certificate-text figure.image { margin: 3mm auto; }
      .certificate-text figure.image img { width: 100%; }
      .certificate-text .image-style-align-left { float: left; margin-right: 5mm; }
      .certificate-text .image-style-align-right { float: right; margin-left: 5mm; }
      .validation { position: fixed; bottom: 8mm; left: 15mm; font-size: 8pt; text-align: left; }
      .validation svg { width: 20mm; height: 20mm; }
    </style>
  </head>
  <body>
    <div class="certificate-text">
      {{ text }}
    </div>
      <div class="validation">
        {% qr_from_text uri size='T' %}
        <br />
        Para validar esse certificado acesse:
        <br />
        <a href="{{ uri }}">{{ uri }}</a>
      </div>
  </body>
</html>
