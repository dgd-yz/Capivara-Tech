{% load static %}
{% load qr_code %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificado - {{ participant.full_name }}</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        border: 0;
      }
      
      @page {
        size: A4 landscape;
        margin: 0;
      }
      
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      
      p {
        font-size: large;
      }
      
      img {
        width: 100%;
      }
      
      div {
        margin: 25% 350px 25% 5em;
      }
    </style>
  </head>
  <body style="background-image: url('{{ background.url }}');">
    <div>
      {{ text }}
      <p style="text-align: left; font-size: smaller; position:fixed; bottom: 2rem;">
        {% qr_from_text uri size='T' %}
        <br />
        Para validar esse certificado acesse:
        <br />
        <a href="{{ uri }}">{{ uri }}</a>
      </p>
    </div>
  </body>
</html>
