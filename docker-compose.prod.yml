services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - capivara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Exposto só no loopback do host; o nginx do host faz o proxy + TLS.
    # Porta 8002 para não colidir com o Baby Tracker (8001) na mesma VPS.
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - capivara_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python3", "docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # o worker não roda migrate/collectstatic (quem faz isso é o web)
      DJANGO_RELEASE: "false"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: ["python3", "manage.py", "db_worker", "--queue-name", "default,pictures"]
    volumes:
      - capivara_uploads:/app/uploads

volumes:
  capivara_pgdata:
  capivara_uploads:
