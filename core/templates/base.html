{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#15110d" />
    <meta name="description" content="Capivara Tech II — o maior evento de tecnologia do Sul do Piauí. 01 a 03 de outubro de 2026, IFPI Campus São Raimundo Nonato." />

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'vendor/bulma/css/bulma.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/capivara.css' %}" />

    <title>{% block title %}Capivara Tech II — Tecnologia, Criatividade e Inovação{% endblock %}</title>
    {% block css %}{% endblock %}
  </head>
  <body>
    <!-- background layers (persist above content) -->
    <div id="ct-progress"></div>
    <canvas id="ct-bg"></canvas>
    <div id="ct-bg-overlay"></div>
    <div id="ct-glow"></div>

    <div class="ct-app">
      {% include "menu.html" %}

      <main id="main">
        {% block content %}{% endblock %}
      </main>

      {% include "footer.html" %}
    </div>

    <section class="is-hidden" style="display:flex;align-items:center;justify-content:center;">
      <span id="loader" class="htmx-indicator loader"></span>
    </section>

    <script src="{% static 'js/bulma.js' %}"></script>
    <script src="{% static 'js/capivara.js' %}"></script>
    {% block js %}{% endblock %}
  </body>
</html>
