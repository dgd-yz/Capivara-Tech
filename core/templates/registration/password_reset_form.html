{% extends 'base.html' %}
{% block title %}Recuperar senha · {{ event.name }}{% endblock %}
{% block content %}
  <section class="ct-prose">
    <div class="ct-page-head">
      <div class="ct-eyebrow">// Acesso</div>
      <h1 class="ct-h2">Recuperar senha</h1>
    </div>
    <p style="margin-bottom:22px;">Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label class="label is-large">E-mail:</label>
        <div class="control">
          <input name="email" type="email" class="input is-large" placeholder="voce@email.com" required />
        </div>
      </div>
      <div class="buttons" style="margin-top:18px;">
        <button class="button is-large is-success" type="submit">Enviar link</button>
        <a href="{% url 'login' %}" role="button" class="button is-large">Voltar</a>
      </div>
    </form>
  </section>
{% endblock %}
