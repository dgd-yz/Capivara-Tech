{% extends base_template %}
{% load crispy_forms_tags %}

{% block title %}Contato · Capivara Tech II{% endblock %}

{% block content %}
  <section class="ct-prose">
  <div class="ct-page-head">
    <div class="ct-eyebrow">// Fale com a gente</div>
    <h1 class="ct-h2">Contato</h1>
  </div>

  <form action="{% url 'contact' %}" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="field buttons">
      <p class="control">
        <button class="button is-large is-success">Enviar Mensagem</button>
      </p>
      <p class="control">
        <button class="button is-large is-warning" type="reset">Limpar</button>
      </p>
      <p class="control">
        <a href="#" role="button" class="button is-large" onclick="history.back()">Voltar</a>
      </p>
    </div>
  </form>
  </section>
{% endblock %}
