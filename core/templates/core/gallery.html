{% extends base_template %}
{% load pictures %}
{% block content %}
  <h3 class="title is-3">Imagens para a memória do V SPA</h3>

  <div class="fixed-grid has-3-cols">
    {% for image in images %}
      <button class="js-modal-trigger" data-target="photo-{{ image.id }}">{% picture image.picture img_alt=image.title img_loading='lazy' picture_class='image' m=4 l=4 %}</button>

      <div id="photo-{{ image.id }}" class="modal" style="--bulma-modal-content-width: 80em;">
        <div class="modal-background"></div>
        <div class="modal-content">
          <p class="image">
            {% picture image.picture img_alt=image.title img_loading='lazy' picture_class='image' m=12 l=12 %}
          </p>
        </div>
        <button class="modal-close is-large" aria-label="close"></button>
      </div>
    {% endfor %}
  </div>
{% endblock %}

{% block js %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Functions to open and close a modal
      function openModal($el) {
        $el.classList.add('is-active')
      }
    
      function closeModal($el) {
        $el.classList.remove('is-active')
      }
    
      function closeAllModals() {
        ;(document.querySelectorAll('.modal') || []).forEach(($modal) => {
          closeModal($modal)
        })
      }
    
      // Add a click event on buttons to open a specific modal
      ;(document.querySelectorAll('.js-modal-trigger') || []).forEach(($trigger) => {
        const modal = $trigger.dataset.target
        const $target = document.getElementById(modal)
    
        $trigger.addEventListener('click', () => {
          openModal($target)
        })
      })
    
      // Add a click event on various child elements to close the parent modal
      ;(document.querySelectorAll('.modal-background, .modal-close, .modal-card-head .delete, .modal-card-foot .button') || []).forEach(($close) => {
        const $target = $close.closest('.modal')
    
        $close.addEventListener('click', () => {
          closeModal($target)
        })
      })
    
      // Add a keyboard event to close all modals
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeAllModals()
        }
      })
    })
  </script>
{% endblock %}
