{% load static %}<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0e12" />
    <meta name="description" content="{{ course.degree }} em {{ course.short_name }} no {{ course.institution }}. {{ course.tagline }}." />
    <link rel="icon" type="image/svg+xml" href="{% if course.logo %}{{ course.logo.url }}{% else %}{% static 'curso/images/si-selo.svg' %}{% endif %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'curso/css/curso.css' %}" />

    <title>{% block title %}{{ course.short_name }} · {{ course.institution }}{% endblock %}</title>
  </head>
  <body>
    {% block content %}{% endblock %}
    <script>
      (function () {
        var nav = document.querySelector(".si-nav");
        var toggle = document.querySelector(".si-nav__toggle");
        if (!nav || !toggle) return;
        toggle.addEventListener("click", function () {
          var open = nav.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });
        nav.querySelectorAll(".si-nav__links a").forEach(function (link) {
          link.addEventListener("click", function () {
            nav.classList.remove("is-open");
            toggle.setAttribute("aria-expanded", "false");
          });
        });
      })();
    </script>
  </body>
</html>
